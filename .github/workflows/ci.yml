name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rankverse
          POSTGRES_PASSWORD: rankverse
          POSTGRES_DB: rankverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rankverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite refuses to run when TEST_DATABASE_URL equals DATABASE_URL.
      DATABASE_URL: postgresql+asyncpg://rankverse:rankverse@localhost:5432/not_the_test_db
      TEST_DATABASE_URL: postgresql+asyncpg://rankverse:rankverse@localhost:5432/rankverse_test
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
